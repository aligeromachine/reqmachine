[build-system]
requires = ["uv-build>=0.12.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "reqmachine"
version = "0.1.5"
description = "A small requests-based HTTP client with retries, JSON parsing and file upload/download helpers."
readme = "README.md"
license = "MIT"
# license-files убран — файла LICENSE нет.
# uv_build сам подхватит LICENSE*/COPYING*/NOTICE*, если они появятся в корне.
authors = [
    { name = "aligeromachine", email = "aligeromachine@github.com" }
]
maintainers = [
    { name = "aligeromachine", email = "aligeromachine@github.com" }
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.22.0",
    "orjson>=3.11.9",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "responses>=0.26.3",
    "urllib3>=2.5.0",
]

[project.urls]
Homepage = "https://reqmachine.org/"
Documentation = "https://github.com/aligeromachine/reqmachine/docs"
Repository = "https://github.com/aligeromachine/reqmachine"
Changelog = "https://github.com/aligeromachine/reqmachine/blob/main/CHANGES.md"

[dependency-groups]
dev = [
    "django>=5.2",
    "pytest>=9.2.0",
    "responses>=0.26.3",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = ""
module-name = "reqmachine"

[tool.setuptools.package-data]
reqmachine = ["py.typed"]

[tool.ty]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
exclude = ["src/generated"]

[tool.ty.rules]
# Отключить правило
redundant-cast = "ignore"
# Повысить предупреждение до ошибки
possibly-missing-import = "error"
