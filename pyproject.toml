[build-system]
requires = ['setuptools', 'wheel']
build-backend = 'setuptools.build_meta'


[project]
name = "reqmachine"
version = "0.1.0"
description = "A small requests-based HTTP client with retries, JSON parsing and file upload/download helpers."
readme = "README.md"
license = "MIT"
authors = [{ name = "aligeromachine", email = "aligeromachine@github.com" }]
maintainers = [{ name = "aligeromachine", email = "aligeromachine@github.com" }]
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "orjson>=3.11.9",
    "requests>=2.34.2",
    "urllib3>=2.5.0",
]


[project.urls]
homepage = "https://reqmachine.org/"
documentation = "https://github.com/aligeromachine/reqmachine/docs"
repository = "https://github.com/aligeromachine/reqmachine"
changelog = "https://github.com/aligeromachine/reqmachine/blob/main/CHANGES.md"


[dependency-groups]
dev = [
    "django>=5.2",
    "pytest>=9.2.0",
    "responses>=0.26.3",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["reqmachine"]

[tool.pytest.ini_options]
testpaths = ["tests"]