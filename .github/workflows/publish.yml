name: Publish to PyPI

on:
  release:
    types: [published]   # Запуск при публикации GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi      # Имя окружения, совпадающее с настройками PyPI и GitHub
    permissions:
      id-token: write      # ОБЯЗАТЕЛЬНО для Trusted Publishing (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
